name: WB Aggregator
on:
  workflow_dispatch:
    inputs:
      site_limit:
        description: 'Limit the number of sites to run for testing (optional)'
        required: false
        type: number
        default: 0 # 0 means no limit
      site:
        description: 'Run for a single site (e.g., "brand-name"). Overrides schedule/site_limit.'
        required: false
        type: string
      upload_categorization_results:
        description: 'Upload categorization results to sheet'
        required: false
        type: boolean
        default: false
      upload_results:
        description: 'Upload results to sheet'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 5 * * 1'

env:
  MONGODB_URL: ${{secrets.MONGODB_URL}}
  GH_TOKEN: ${{secrets.GH_TOKEN}}
  GOOGLE_SERVICE_ACCOUNT_CREDENTIALS: ${{secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS}}
  GOOGLE_SHEET_ID: ${{secrets.GOOGLE_SHEET_ID}}
  GOOGLE_SHEET_ID_FOR_LOGS: ${{secrets.GOOGLE_SHEET_ID_FOR_LOGS}}

jobs:
  prepare_matrix:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.set-matrix.outputs.sites }}
      has-sites: ${{ steps.set-matrix.outputs.has-sites }}
      has-sheet-data: ${{ steps.set-matrix.outputs.has-sheet-data }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install googleapis
      
      - name: Create package.json for CommonJS
        run: |
          cat > package.json << 'EOF'
          {
            "type": "commonjs"
          }
          EOF
      
      - name: Fetch sheet data and prepare matrix
        id: set-matrix
        env:
          SITE_LIMIT: ${{ github.event.inputs.site_limit }}
          SINGLE_SITE: ${{ github.event.inputs.site }}
        run: node scripts/fetch-sheet-data-for-action.js
      - name: Upload sheet data artifact
        uses: actions/upload-artifact@v4
        if: steps.set-matrix.outputs.has-sheet-data == 'true'
        with:
          name: sheet-data
          path: sheet-data.json
          retention-days: 1

  dizitv_job:
    needs: prepare_matrix
    if: needs.prepare_matrix.outputs.has-sites == 'true'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        site: ${{ fromJSON(needs.prepare_matrix.outputs.sites) }}
    uses: ./.github/workflows/reusableProdPuppeteer.yml
    with:
      site: ${{ matrix.site }}
      upload_categorization_results: ${{ inputs.upload_categorization_results || false }}
      upload_results: ${{ inputs.upload_results || false }}
    secrets: inherit

  summarize_run:
    runs-on: ubuntu-latest
    needs: dizitv_job
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit

      - name: Download all run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded files
        run: ls -R artifacts/

      - name: Generate Final Summary Report
        id: summary-report
        run: |
          node scripts/summarize-run.js artifacts/

      - name: Upload Final Summary Report
        uses: actions/upload-artifact@v4
        with:
          name: final-run-summary
          path: artifacts/final-summary.json

      - name: Upload Aggregated Metrics to Google Sheet
        if: always()
        run: |
          node scripts/upload-summary-to-sheet.js ${{ github.workspace }}/artifacts/final-summary.json